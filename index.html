<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DexaFit Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .contact-box {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0px 5px 15px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
      color: #444;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
    }
    input[type="file"] {
      border: none;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #007BFF;
      color: #fff;
      border: none;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="contact-box">
    <h2>DexaFit Form</h2>
    <form action="https://getform.io/f/aejezpjb" method="POST" enctype="multipart/form-data">
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" required>

      <label for="address">Address</label>
      <input type="text" id="address" name="address" required>

      <label for="state">State</label>
      <input type="text" id="state" name="state" required>

      <label for="city">City</label>
      <input type="text" id="city" name="city" required>

      <label for="zipcode">Zip Code</label>
      <input type="text" id="zipcode" name="zipcode" required>

      <label for="phone">Cell Phone Number</label>
      <input type="tel" id="phone" name="phone" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>

      <label for="image1">Upload Image 1</label>
      <input type="file" id="image1" name="image1" accept="image/*" required>

      <label for="image2">Upload Image 2</label>
      <input type="file" id="image2" name="image2" accept="image/*" required>

      <label for="image3">Upload Image 3</label>
      <input type="file" id="image3" name="image3" accept="image/*" required>

      <button type="submit">Submit</button>
    </form>
  </div>
</body>
</html>
